services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chanakya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chanakya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chanakya_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-chanakya_commons}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chanakya} -d ${POSTGRES_DB:-chanakya_commons}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: chanakya-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chanakya_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chanakya_minio_pass}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chanakya-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chanakya}:${POSTGRES_PASSWORD:-chanakya_dev_pass}@postgres:5432/${POSTGRES_DB:-chanakya_commons}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-chanakya-docker-secret-key-change-me-32chars}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chanakya_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chanakya_minio_pass}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-chanakya-raw-lake}
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-research-commons@chanakyauniversity.edu.in}
      ARXIV_RATE_LIMIT_SECONDS: ${ARXIV_RATE_LIMIT_SECONDS:-3.0}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      HF_HOME: /app/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./data_warehouse:/app/data_warehouse
      - ./evaluation/results:/app/evaluation/results
      - hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: chanakya-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  hf_cache:
